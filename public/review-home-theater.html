<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capsule Company - Mini Home Theater Review</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12100E;
      --card-bg: #1C1815;
      --copper: #B86D43;
      --copper-bright: #CE7F53;
      --border: rgba(184, 109, 67, 0.25);
      --text: #F7F3ED;
      --text-muted: #A89B91;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 2rem 1.5rem 4rem;
    }
    .header {
      max-width: 1400px;
      margin: 0 auto 2.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #FFFFFF;
      padding: 4px;
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
    }
    .sub {
      color: var(--copper);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      background: var(--copper);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.82rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--copper-bright); }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
    }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .img-wrap {
      width: 100%;
      height: 380px;
      position: relative;
      background: #000;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(18, 16, 14, 0.85);
      border: 1px solid var(--border);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      color: var(--copper-bright);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 0.35rem;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .desc {
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex: 1;
    }
    .bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 0.75rem;
    }
    .bullets li {
      font-size: 0.78rem;
      color: #D6CBC1;
      display: flex;
      gap: 6px;
    }
    .bullets li::before {
      content: '◆';
      color: var(--copper);
      font-size: 0.6rem;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-wrap">
      <div class="brand-logo">
        <img src="logo.png" alt="Capsule Company">
      </div>
      <div>
        <div class="sub">Volume 2026 Architectural Archives</div>
        <h1>Mini Home Theater Collection</h1>
      </div>
    </div>
    <div class="actions">
      <a href="Capsule_Company_Mini_Home_Theater_Catalogue.pdf" target="_blank" class="btn">
        <span>Download Official PDF (17 Pages)</span>
      </a>
      <a href="capsule-catalogue-index.html" class="btn btn-secondary">
        <span>Back to All Catalogues</span>
      </a>
    </div>
  </header>

  <main class="grid" id="theaterGrid"></main>

  <script>
    fetch('assets/mini-home-theater/mini-home-theater-data.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('theaterGrid');
        container.innerHTML = data.orderedItems.map(item => `
          <div class="card">
            <div class="img-wrap">
              <img src="assets/mini-home-theater/${item.fileName}" alt="${item.title}" loading="lazy">
              <span class="badge">${item.category}</span>
            </div>
            <div class="info">
              <span class="code">CODE: ${item.refId}</span>
              <h2 class="title">${item.title}</h2>
              <p class="desc">${item.desc}</p>
              <ul class="bullets">
                ${item.bullets.map(b => `<li>${b}</li>`).join('')}
              </ul>
            </div>
          </div>
        `).join('');
      });
  </script>

</body>
</html>
